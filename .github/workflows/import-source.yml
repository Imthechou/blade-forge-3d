name: Import V3 project sources

on:
  push:
    branches: [chore/restore-v3-pages-20261027]
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/chore/restore-v3-pages-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack V3 into editable project directory
        run: |
          python3 scripts/prepare_site.py '锻刀大赛_v3.0.zip' game
          test -s game/index.html
          test -s game/package.json
          echo "Files: $(find game -type f | wc -l)"
          du -sh game
      - name: Commit source tree to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/
          if git diff --cached --quiet; then
            echo "Nothing to import"
          else
            git commit -m "chore: unpack V3 game for file-level development"
            git push origin HEAD:chore/restore-v3-pages-20261027
          fi
