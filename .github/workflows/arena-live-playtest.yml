name: Arena live browser playtest
on:
  pull_request:
    branches: [main, test/arena-live-playtest-20261027]
    paths:
      - 'game/tools/arena-live-playtest.mjs'
      - '.github/workflows/arena-live-playtest.yml'
      - 'game/src/ui/pages/arena.js'
      - 'game/src/ui/arenaStage.js'
      - 'game/src/ui/arenaSprites.js'
      - 'game/assets/arena/**'
      - 'game/tools/build_arena_sprites.py'
      - 'game/src/ui/arenaImpact.js'
      - 'game/src/platform/audio.js'
      - 'game/src/core/arenaEncounters.js'
      - 'game/tests/arena-impact.test.mjs'
      - 'game/src/ui/formalTestStage.js'
      - 'game/src/core/arenaChallenge.js'
      - 'game/src/core/arenaFormal.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-browser-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  arena-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use runner Chrome (same verified browser as forge visual acceptance)
        working-directory: game
        run: |
          npm install --no-save --package-lock=false playwright
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Install CJK font for accurate Chinese mobile screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
      - name: Run all core and tournament regression tests
        working-directory: game
        run: npm test
      - name: Run local web server
        run: |
          nohup node game/serve.cjs 8123 127.0.0.1 > arena-server.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8123/ > /dev/null
      - name: Play all live arena entries and six-material visual gallery
        working-directory: game
        run: node tools/arena-live-playtest.mjs
      - name: Package reviewable game with generated sprites
        if: always()
        run: |
          zip -q -r arena-sprite-review-build.zip game \
            -x 'game/node_modules/*' 'game/arena-playtest/*' 'game/.cache/*'
          ls -lh arena-sprite-review-build.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blade-forge-arena-sprite-review-build
          path: arena-sprite-review-build.zip
          retention-days: 14
      - name: Upload screenshots, run report and server logs even if test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-playtest-evidence
          path: |
            game/arena-playtest/
            arena-server.log
          retention-days: 14
