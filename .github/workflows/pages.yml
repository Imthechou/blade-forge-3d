name: Deploy Blade Forge V3 to GitHub Pages

on:
  push:
    branches: [main, chore/restore-v3-pages-20261027]
    paths:
      - '锻刀大赛_v3.0.zip'
      - 'scripts/prepare_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: blade-forge-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release and locate website
        run: python3 scripts/prepare_site.py '锻刀大赛_v3.0.zip' dist
      - name: Check site entry point
        run: test -s dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
