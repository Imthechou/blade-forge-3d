name: Deploy Blade Forge to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release package
        run: |
          rm -rf dist /tmp/bladeforge
          mkdir -p dist /tmp/bladeforge
          unzip -q "锻刀大赛V3_发布包_2026-10-06.zip" -d /tmp/bladeforge
          RELEASE_DIR="$(find /tmp/bladeforge -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$RELEASE_DIR"
          cp -a "$RELEASE_DIR"/. dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
