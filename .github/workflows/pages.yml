name: Verify and deploy Blade Forge to GitHub Pages

on:
  push:
    branches: [main, chore/restore-v3-pages-20261027]
    paths:
      - 'game/**'
      - '锻刀大赛_v3.0.zip'
      - 'scripts/prepare_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: blade-forge-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify game source
        if: hashFiles('game/package.json') != ''
        working-directory: game
        run: npm run verify
      - name: Prepare website
        run: |
          if [ -s game/index.html ]; then
            echo "Deploying editable game/ source"
            mkdir -p dist
            cp -a game/. dist/
          else
            echo "game/ unavailable, using legacy release archive"
            python3 scripts/prepare_site.py '锻刀大赛_v3.0.zip' dist
          fi
          test -s dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
