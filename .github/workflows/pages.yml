name: Deploy Blade Forge to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract game package
        run: |
          rm -rf dist
          mkdir -p dist
          unzip -q "锻刀大赛_3D版_v9.zip" -d /tmp/bladeforge
          cp -a /tmp/bladeforge/锻刀大赛_3D版/. dist/
          cp -f js/hotfix.js dist/js/hotfix.js
          sed -i 's#</body>#<script src="js/hotfix.js"></script></body>#' dist/index.html
          sed -i 's#height:min(46vh,430px);#height:auto;aspect-ratio:4 / 5;max-height:430px;min-height:300px;#' dist/css/app.css
          sed -i 's#\.stage-shell{height:42vh}#\.stage-shell{aspect-ratio:4 / 5;height:auto;max-height:none}#' dist/css/app.css

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
