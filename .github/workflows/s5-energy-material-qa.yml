name: S5 craft families and energy budget visual QA
on:
  push:
    branches: [feat/s5-family-material-energy-budget-20261027]
    paths:
      - 'game/src/**'
      - 'game/tests/s5-visual-contract.test.mjs'
      - 'tools/s5-energy-material-audit.mjs'
      - '.github/workflows/s5-energy-material-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install real Chrome runner
        working-directory: game
        run: |
          npm install --no-save --package-lock=false playwright pngjs
          sudo timeout 30s apt-get install -y fonts-noto-cjk || true
      - name: Verify all game logic and visual contracts
        working-directory: game
        run: npm test
      - name: Launch candidate source
        run: |
          nohup node game/serve.cjs 8123 127.0.0.1 > server.log 2>&1 &
          sleep 2
      - name: Real WebGL mobile gallery and material-response audit
        working-directory: game
        run: |
          cp ../tools/s5-energy-material-audit.mjs tools/s5-energy-material-audit.mjs
          node tools/s5-energy-material-audit.mjs
      - name: Upload audit data and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-energy-and-substrate-qa
          path: |
            game/s5-energy-review/
            server.log
          retention-days: 14
